* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: #19181B;
  color: #F2EEE5;
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px 40px;
  text-align: center;
}
main { width: 100%; max-width: 480px; }
.lockup {
  width: 100%;
  max-width: 220px;
  margin: 0 auto 26px;
  display: block;
}
.lockup svg { width: 100%; height: auto; display: block; }
h1 {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 16px;
}
.pill {
  display: inline-block;
  background: #FF5D3A;
  color: #19181B;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 6px 14px;
  margin-bottom: 22px;
}
.btn {
  display: block;
  width: 100%;
  background: #E3F42A;
  color: #19181B;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  padding: 18px 20px;
  border-radius: 10px;
  margin: 0 0 14px;
}
.btn:active { transform: translateY(1px); }
.rawlink {
  display: block;
  word-break: break-all;
  color: #DAD9D9;
  font-size: 12px;
  line-height: 1.6;
  background: #232227;
  border: 1px solid #34333A;
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 26px;
  text-decoration: none;
  user-select: all;
  -webkit-user-select: all;
}
.notes {
  text-align: left;
  color: #DAD9D9;
  font-size: 13px;
  line-height: 1.65;
  border-top: 1px solid #34333A;
  padding-top: 18px;
}
.notes li { list-style: none; padding-left: 18px; position: relative; margin-bottom: 10px; }
.notes li::before { content: ">"; position: absolute; left: 0; color: #E3F42A; }
.muted { color: #DAD9D9; font-size: 14px; line-height: 1.7; }
.powered-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 24px;
  color: #6E6D73;
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.powered-row img { width: 20px; height: 20px; border-radius: 6px; display: block; }
footer { margin-top: 34px; color: #6E6D73; font-size: 11px; letter-spacing: 0.08em; }
</style>
